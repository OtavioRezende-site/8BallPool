name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Ajustar configuracao do projeto
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()
          text = text.replace(
              "android {",
              "android {\n    namespace 'app.hack.eightballpool'",
              1
          )
          text = text.replace(
              'applicationId "app.hack.eightballpool"',
              'applicationId "br.com.otavio.poolguide"'
          )
          path.write_text(text)
          PY

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-8BallPool
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
